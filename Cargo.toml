[package]
name = "zview-desktop"
version = "0.3.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
gpui-kit = "=0.7.3"
lyon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
console_error_panic_hook = "0.1"
futures-util = "0.3"
gloo-net = { version = "=0.6.0", default-features = false, features = ["http", "json", "websocket"] }
gloo-timers = { version = "=0.3.0", features = ["futures"] }
web-sys = { version = "0.3", features = ["Location", "Window"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# Match Kit 0.7.3's GPUI snapshot. Enabling Kit's test-support feature also
# resolves its optional Fast backend, whose pinned dependencies conflict here.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

# Keep first browser builds quick without shipping debug information.
[profile.web]
inherits = "dev"
debug = 0

# Release browser site. Measured on the WASM module, vs. plain `release`:
# 15.0 MB raw / 4.9 MB gzip instead of 25.0 / 7.0. That is 15% smaller than
# opt-level 3 (5.9 MB gzip) with about 4% slower redraws. opt-level "z" saves
# 0.6 MB more but redraws about 17% slower. The native app keeps `release`.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

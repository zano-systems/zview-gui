# The zview-gui Python package: the local adapter (web-ui/zview_gui) plus the
# prebuilt browser site, which hatch_build.py adds to wheels from target/web.
# Release CI builds the optimized site first (see CONTRIBUTING.md).

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "zview-gui"
# Keep in step with Cargo.toml and web-ui/requirements-west.txt.
version = "0.4.0"
description = "Browser UI for ZView: live and recorded Zephyr RTOS kernel views"
readme = "web-ui/PYPI.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Zano Systems" }]
keywords = ["zephyr", "rtos", "zview", "debugging", "embedded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Embedded Systems",
]
# ZView's session API is pinned exactly; the rest only needs compatible
# releases, so the package fits into a shared Zephyr environment. CI tests
# the exact versions in web-ui/requirements.txt.
dependencies = [
    "zview==0.28.1",
    "aiohttp>=3.13,<4",
    "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/zano-systems/zview-gui"
Source = "https://github.com/zano-systems/zview-gui"
Issues = "https://github.com/zano-systems/zview-gui/issues"

[project.scripts]
zview-gui = "zview_gui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["web-ui/zview_gui"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZView</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225.5%22 fill=%22%23080808%22/%3E%3Cg fill=%22none%22 stroke=%22%2376f6f5%22 stroke-width=%222.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M4 5.5h10.5L4 15.5h7l1.5-4 2 7 1.5-3%22/%3E%3Ccircle cx=%2219.5%22 cy=%2215.5%22 r=%221.6%22 fill=%22%2376f6f5%22 stroke=%22none%22/%3E%3C/g%3E%3C/svg%3E">
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1d34; color: #e6dfef; }
      body { font-family: system-ui, sans-serif; }
      body > canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #status { position: fixed; z-index: 10; top: 16px; left: 16px; right: 16px; padding: 12px; background: #25223b; white-space: pre-wrap; }
      #status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="status" role="status">Loading ZView…</div>
    <input id="json-file" type="file" accept=".json,application/json" hidden>
    <noscript>ZView needs JavaScript and WebAssembly enabled.</noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>

[package]
name = "zview-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
probe-rs = ["dep:probe-rs"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
probe-rs = { version = "=0.32.0", optional = true, default-features = false, features = ["builtin-targets"] }

[dependencies]
anyhow = "1"
flate2 = "1"
gimli = { version = "0.32", default-features = false, features = ["read", "std"] }
object = { version = "0.37", default-features = false, features = ["elf", "read_core", "unaligned", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
